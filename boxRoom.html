<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Labyrinth Quest!</title>
<link rel="icon" href="./images/favicon.ico">
<link rel="stylesheet" href="stylesheet.css">
</head>
<body onload="playerDetails()">

<script>
	function playerDetails(){
		var name = (localStorage.getItem("pname"));
		document.getElementById("playerName").innerHTML = name;
		
		//Remembers page address
		localStorage.setItem("mapID","boxRoom");
		
		//Checks if player has a hammer:
		if(localStorage.getItem("hasHammer") == 1){
			document.getElementById("hammer").style.display = "inherit";	
		} else {
			document.getElementById("hammer").style.display = "none";		
		}
		
		//Checks if player has a key:
		if(localStorage.getItem("hasKey") == 1){
			document.getElementById("key").style.display = "inherit";	
		} else {
			document.getElementById("key").style.display = "none";		
		}
		
		//Checks if player has a ruby:
		if(localStorage.getItem("hasRuby") == 1){
			document.getElementById("ruby").style.display = "inherit";	
		} else {
			document.getElementById("ruby").style.display = "none";	
		}
		
		//Checks if player has a sword:
		if(localStorage.getItem("hasSword") == 1){
			document.getElementById("sword").style.display = "inherit";	
		} else {
			document.getElementById("sword").style.display = "none";		
		}
		
		//Checks if player has a torch:
		if(localStorage.getItem("hasTorch") == 1){
			document.getElementById("torch").style.display = "inherit";	
			document.getElementById("TorchContainer").style.display = "none";
		} else {
			document.getElementById("torch").style.display = "none";		
		}
		
		//Checks if player has a spray:
		if(localStorage.getItem("hasSpray") == 1){
			document.getElementById("spray").style.display = "inherit";	
		} else {
			document.getElementById("spray").style.display = "none";		
		}
		
		//Checks if player has a book:
		if(localStorage.getItem("hasBook") == 1){
			document.getElementById("book").style.display = "inherit";	
		} else {
			document.getElementById("book").style.display = "none";		
		}
	}
	
</script>


<div class="sidebar" >
  
  <div class="sidebarPlayer">
		<h3 class="sidebarHeader">Player:</h3>
		<br>
		<h3 class="sidebarHeader"><span id="playerName"></span> the Hero</h3>
		<br>
		<img src="images/Hero.png" style="border: 1px solid black; height:60%; left: 0; background-color: grey;">
  </div>
  <div class="sidebarInvContainer">
	<h3 class="sidebarHeader">Inventory:</h3>
	<div class="sidebarItem"><button style="position: relative; height: 100%; width: 100%; outline: none; background-color: Transparent; border: none;"><img id="hammer" src="images/Hammer.png" style="top:0%; left: 0%;"></button></div>
	<div class="sidebarItem"><button style="position: relative; height: 100%; width: 100%; outline: none; background-color: Transparent; border: none;"><img id="key" src="images/Key.png" style="top:0%; left: 0%;"></button></div>
	<div class="sidebarItem"><button style="position: relative; height: 100%; width: 100%; outline: none; background-color: Transparent; border: none;"><img id="ruby" src="images/Ruby.png" style="top:0%; left: 0%;"></button></div>
	<div class="sidebarItem"><button style="position: relative; height: 100%; width: 100%; outline: none; background-color: Transparent; border: none;"><img id="sword" src="images/Sword.png" style="top:0%; left: 0%;"></button></div>
	<div class="sidebarItem"><button style="position: relative; height: 100%; width: 100%; outline: none; background-color: Transparent; border: none;"><img id="torch" src="images/Torch.png" style="top:0%; left: 0%;"></button></div>
	<div class="sidebarItem"><button style="position: relative; height: 100%; width: 100%; outline: none; background-color: Transparent; border: none;"><img id="spray" src="images/MimicSpray.png" style="top:0%; left: 0%;"></button></div>
	<div class="sidebarItem"><button style="position: relative; height: 100%; width: 100%; outline: none; background-color: Transparent; border: none;"><img id="book" src="images/CyclopsTranslateBook.png" style="top:0%; left: 0%;"></button></div>
  </div>
</div>

<div class = "gameMain">
	<h1>Labyrinth Quest</h1>
	<audio controls src="sounds/bardstale.mp3" style="position: absolute; left: 65%; top: 2%; min-width: 5%; z-index: 5;"></audio>
	<div class="gameImage">
		<img src="images/maps/BoxRoom.png">
		<div class="navArrow" style="rotate:180deg; top:75%; left:40%;">
			<a href="waterPuzzleRoom.html"><img src="images/Arrow.png" class="arrow"></a>
		</div>
		<div class="navArrow" style="top:-15%; left:40%;">
			<a href="cyclopsRoom.html"><img src="images/Arrow.png" class="arrow"></a>
		</div>
		
		<div class= "mapElement" style="width:20%; height:45%; left: 10%; top: 20%;" id="ChestContainer">
			<img src="images/Chest.png" style="" id="Chest" >
				<button onclick="checkForBook()" style="position: relative; height: 100%; width: 100%; outline: none; background-color: Transparent; border: none; z-index: 1;"></button>
			</img>
		</div>
		
		<div class= "mapElement" style="width:10%; height:25%; left: 86%; top: 13%; rotate:0deg;" id="TorchContainer">
			<img src="images/Torch.png" style="" id="Torch" >
				<button onclick="getTorch()" style="position: relative; height: 100%; width: 100%; outline: none; background-color: Transparent; border: none; z-index: 1;"></button>
			</img>
		</div>
		
		<div class = "gameBackground" id="gameBackground" style="display: none;">
		
			<div class = "upArrowContainer" style="position: relative; width: 80%; height: 20%; top: 5%; left: 10%; border: 1px solid black;">
				<div class = "upArrow"><button onclick="leftTumbler('up')" style="position: relative; height: 100%; width: 100%;"><img src="images/Arrow.png" style="position: relative; top:0%; left 0%;"></button></div>
				<div class = "upArrow"><button onclick="middleTumbler('up')" style="position: relative; height: 100%; width: 100%;"><img src="images/Arrow.png" style="position: relative; top:0%; left 0%;"></button></div>
				<div class = "upArrow"><button onclick="rightTumbler('up')" style="position: relative; height: 100%; width: 100%;"><img src="images/Arrow.png" style="position: relative; top:0%; left 0%;"></button></div>
			</div>
			<div class = "numberContainer" style="position: relative; width: 80%; height: 40%; top: 10%; left: 10%; border: 1px solid black;">
				<div class="number"><h3 id="left" style="font-size: 9em; height: 100%;">4</h3></div>
				<div class="number"><h3 id="middle" style="font-size: 9em; height: 100%;">5</h3></div>
				<div class="number"><h3 id="right" style="font-size: 9em; height: 100%;">6</h3></div>
			</div>
			<div class = "downArrowContainer" style="position: relative; width: 80%; height: 20%; top: 15%; left: 10%; border: 1px solid black;">
				<div class = "downArrow"><button onclick="leftTumbler('down')" style="position: relative; height: 100%; width: 100%;"><img src="images/Arrow.png" style="rotate:180deg; position: relative; top:0%; left 0%;"></img></button></div>
				<div class = "downArrow"><button onclick="middleTumbler('down')"style="position: relative; height: 100%; width: 100%;"><img src="images/Arrow.png" style="rotate:180deg; position: relative; top:0%; left 0%;"></img></button></div>
				<div class = "downArrow"><button onclick="rightTumbler('down')"style="position: relative; height: 100%; width: 100%;"><img src="images/Arrow.png" style="rotate:180deg; position: relative; top:0%; left 0%;"></img></button></div>
			</div>
			
			<button onclick="hideShowLock()">Exit</button>
		
		</div>
	</div>
	
	<style>
	
	.downArrow{
		position: relative; 
		left: 5%; 
		display: inline-block; 
		width: 30%; 
		border: 1px solid black; 
		height: 100%;
		text-align: center;
	
	}
	
	.upArrow{
	
		position: relative; 
		left: 5%; 
		display: inline-block; 
		width: 30%; 
		border: 1px solid black; 
		height: 100%;
		text-align: center;
	}
	
	.number{
	
		position: relative; 
		left: 5%; 
		display: inline-block; 
		width: 30%; 
		border: 1px solid black; 
		height: 100%;
		text-align: center;
	
	}
	
	</style>
	<div class="gameText">
	
		<div class="gamePortrait">
			<img id="Speaker" src="images/Narrator.png">
		</div>
		
		<div class="gameDialog">
			<h3 id = "Speech"></h3>
		</div>
	
	</div>

</div>

<script>

	var leftDigit = 4;
	var middleDigit = 5;
	var rightDigit = 6;

	function hideShowLock() {
		var miniGame = document.getElementById("gameBackground");
		var arrows = document.getElementsByClassName("navArrow");
		if (miniGame.style.display === "none") {
			miniGame.style.display = "inherit";
			for (let i = 0; i < arrows.length; i++) {
				arrows[i].style.display = "none";
			}
			document.getElementById("Speech").innerHTML = "Looks like I need a 3 digit code to open this chest.";
			var img = document.getElementById("Speaker");
			img.src="images/Hero.png";
		} else {
			miniGame.style.display = "none";
			for (let i = 0; i < arrows.length; i++) {
				arrows[i].style.display = "inherit";
			}
			document.getElementById("Speech").innerHTML = "";
			var img = document.getElementById("Speaker");
			img.src="images/Narrator.png";
		}
		
		
	}
	
	function leftTumbler(upDown){
	
		if(upDown == 'up'){
		
			if(leftDigit == 9){
				leftDigit = 0;
			} else {
				leftDigit++;
			}
		
		}
		
		if(upDown == 'down'){
		
			if(leftDigit == 0){
				leftDigit = 9;
			} else {
				leftDigit--;
			}
		
		
		}
		
		document.getElementById("left").innerHTML = leftDigit;
		checkCode();
	
	}
	
	function middleTumbler(upDown){
	
		if(upDown == 'up'){
		
			if(middleDigit == 9){
				middleDigit = 0;
			} else {
				middleDigit++;
			}
		
		}
		
		if(upDown == 'down'){
		
			if(leftDigit == 0){
				middleDigit = 9;
			} else {
				middleDigit--;
			}
		
		
		}
		
		document.getElementById("middle").innerHTML = middleDigit;
		checkCode();
	
	}
	
	function rightTumbler(upDown){
	
		if(upDown == 'up'){
		
			if(rightDigit == 9){
				rightDigit = 0;
			} else {
				rightDigit++;
			}
		
		}
		
		if(upDown == 'down'){
		
			if(rightDigit == 0){
				rightDigit = 9;
			} else {
				rightDigit--;
			}
		
		
		}
		
		document.getElementById("right").innerHTML = rightDigit;
		checkCode();
	
	}
	
	function checkCode(){
	
		//Correct code is 801
	
		if(leftDigit == 8 && middleDigit == 0 && rightDigit == 1){
			hideShowLock();
			document.getElementById("Speech").innerHTML = "You enter the code 801 and hear a CLICK as the chest pops open. Inside is a 'English to Cyclops' translation book. You stuff it into your pocket.";
			var img = document.getElementById("Speaker");
			img.src="images/Narrator.png";
			localStorage.setItem("hasBook","1");
			playerDetails();
		}
	}
	
	function checkForBook(){
	
		if(localStorage.getItem("hasBook") == "1"){
			document.getElementById("Speech").innerHTML = "I already emptied this chest.";
			var img = document.getElementById("Speaker");
			img.src="images/Hero.png";
		} else {
			hideShowLock();
		}
	}
	
	function getTorch(){
	
		document.getElementById("Speech").innerHTML = "You spy a torch mounted to the wall. You take the lit torch and stuff it in your pocket. How is this possible? Magic pockets.";
		var img = document.getElementById("Speaker");
		img.src="images/Narrator.png";
		localStorage.setItem("hasTorch","1");
		playerDetails();
		
	
	}
	
</script>

</body>
